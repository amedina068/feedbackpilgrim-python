[project]
name = "feedbackpilgrim"
dynamic = ["version"]
description = "Python client for the Feedback Pilgrim API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alejandro Medina" }]
keywords = ["feedbackpilgrim", "feedback", "roadmap", "changelog", "webhooks", "api", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/amedina068/feedbackpilgrim-python"
Documentation = "https://feedbackpilgrim.com/docs/sdks/overview"
Issues = "https://github.com/amedina068/feedbackpilgrim-python/issues"
Repository = "https://github.com/amedina068/feedbackpilgrim-python"
Changelog = "https://github.com/amedina068/feedbackpilgrim-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/feedbackpilgrim/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/feedbackpilgrim"]

[tool.hatch.build.targets.sdist]
include = ["src/feedbackpilgrim", "tests", "README.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls a live Feedback Pilgrim instance"]
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "RET"]
